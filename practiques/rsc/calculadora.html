<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
  <style>
    #calculadora {
      width: 220px;
      margin: 20px auto;
    }

    #pantalla {
      width: 100%;
      height: 40px;
      font-size: 18px;
      margin-bottom: 10px;
      text-align: right;
    }

    #botons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    button {
      height: 40px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="calculadora">
  <input type="text" id="pantalla" readonly>

  <div id="botons">
    <button id="b7">7</button>
    <button id="b8">8</button>
    <button id="b9">9</button>
    <button id="bDiv">/</button>

    <button id="b4">4</button>
    <button id="b5">5</button>
    <button id="b6">6</button>
    <button id="bMul">*</button>

    <button id="b1">1</button>
    <button id="b2">2</button>
    <button id="b3">3</button>
    <button id="bRes">-</button>

    <button id="b0">0</button>
    <button id="bC">C</button>
    <button id="bIgual">=</button>
    <button id="bSum">+</button>
  </div>
</div>

<script>
var pantalla = document.getElementById("pantalla");

// Variables de càlcul
var primerNumero = null;
var operacio = null;

// FUNCIÓ PER AFEGIR TEXT A LA PANTALLA
function escriure(valor) {
  pantalla.value = pantalla.value + valor;
}

// BOTONS NUMÈRICS
document.getElementById("b0").addEventListener("click", function() { escriure("0"); });
document.getElementById("b1").addEventListener("click", function() { escriure("1"); });
document.getElementById("b2").addEventListener("click", function() { escriure("2"); });
document.getElementById("b3").addEventListener("click", function() { escriure("3"); });
document.getElementById("b4").addEventListener("click", function() { escriure("4"); });
document.getElementById("b5").addEventListener("click", function() { escriure("5"); });
document.getElementById("b6").addEventListener("click", function() { escriure("6"); });
document.getElementById("b7").addEventListener("click", function() { escriure("7"); });
document.getElementById("b8").addEventListener("click", function() { escriure("8"); });
document.getElementById("b9").addEventListener("click", function() { escriure("9"); });

// BOTONS OPERACIONS
document.getElementById("bSum").addEventListener("click", function() {
  primerNumero = parseFloat(pantalla.value);
  operacio = "+";
  escriure("+");
});

document.getElementById("bRes").addEventListener("click", function() {
  primerNumero = parseFloat(pantalla.value);
  operacio = "-";
  escriure("-");
});

document.getElementById("bMul").addEventListener("click", function() {
  primerNumero = parseFloat(pantalla.value);
  operacio = "*";
  escriure("*");
});

document.getElementById("bDiv").addEventListener("click", function() {
  primerNumero = parseFloat(pantalla.value);
  operacio = "/";
  escriure("/");
});

// BOTÓ IGUAL
document.getElementById("bIgual").addEventListener("click", function() {
  var contingut = pantalla.value;

  // Separem per l’operador
  var segonNumero;

  if (operacio === "+") {
    segonNumero = parseFloat(contingut.split("+")[1]);
    pantalla.value = primerNumero + segonNumero;
  }
  else if (operacio === "-") {
    segonNumero = parseFloat(contingut.split("-")[1]);
    pantalla.value = primerNumero - segonNumero;
  }
  else if (operacio === "*") {
    segonNumero = parseFloat(contingut.split("*")[1]);
    pantalla.value = primerNumero * segonNumero;
  }
  else if (operacio === "/") {
    segonNumero = parseFloat(contingut.split("/")[1]);
    if (segonNumero === 0) {
      alert("No es pot dividir entre zero");
      return;
    }
    pantalla.value = primerNumero / segonNumero;
  }
});

// BOTÓ C (netejar)
document.getElementById("bC").addEventListener("click", function() {
  pantalla.value = "";
  primerNumero = null;
  operacio = null;
});
</script>

</body>
</html>
