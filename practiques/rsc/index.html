<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Tasques</title>
    <link rel="stylesheet" href="estil.css">
    <script src="app.js"></script>
</head>
<body>

    <h1 class="titol">Gestor de Tasques</h1>

    <div class="panel">
        <div class="botons">
            <button class="btn nova" onclick="afegirTasca()">Nova tasca</button>
            <button class="btn pendents" onclick="mostrarPendents()">Tasques pendents</button>
            <button class="btn completades" onclick="mostrarCompletades()">Tasques completades</button>
            <button class="btn eliminar" onclick="eliminarTasca()">Eliminar tasca</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
