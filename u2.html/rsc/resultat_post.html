<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <title>Resultat POST</title>
  
</head>
<body>
  <h2>Resultat de l'enviament (POST simulat)</h2>
  <div id="resultat" class="resultat"></div>

  <script>
    const dadesJSON = localStorage.getItem('dadesFormulari');
    if (dadesJSON) {
      const dades = JSON.parse(dadesJSON);
      const cont = document.getElementById('resultat');
      cont.innerHTML = `
        <div class="camp"><span class="etiqueta">Nom:</span> ${dades.nom}</div>
        <div class="camp"><span class="etiqueta">Sexe:</span> ${dades.sexe}</div>
        <div class="camp"><span class="etiqueta">Correu:</span> ${dades.email}</div>
        <div class="camp"><span class="etiqueta">Contrasenya:</span> ${dades.password}</div>
      `;
      // Eliminem les dades després de mostrar-les
      localStorage.removeItem('dadesFormulari');
    } else {
      document.getElementById('resultat').textContent = "No s'han trobat dades enviades.";
    }
  </script>

</body>
</html>
